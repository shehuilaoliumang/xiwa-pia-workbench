<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ bootstrap.csrf_token }}">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='navigation.css') }}">
  <script id="bootstrap" type="application/json">{{ bootstrap|tojson }}</script>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  <script src="{{ url_for('static', filename='navigation.js') }}" defer></script>
</head>
<body data-page="{% block page %}catalog{% endblock %}">
<a class="skip-link" href="#main">跳到主要内容</a>
<header class="site-header">
  <a class="brand" href="/" aria-label="{{ app_name }}首页"><span class="brand-mark">{{ brand_mark }}</span><span><strong>{{ app_name }}</strong><small>{{ tagline }}</small></span></a>
  <nav class="main-nav" aria-label="主要导航"><a href="/" data-nav="catalog">{{ terms.catalog }}</a><a href="/control" data-nav="control">{{ terms.control }}</a><a href="/manage" data-nav="manage">{{ terms.manage }}</a></nav>
  <div class="local-badge"><span></span>本地{{ app_short_name }}</div>
</header>
<main id="main" class="workspace">{% block content %}{% endblock %}</main>
<footer class="site-footer"><span>{{ app_name }}</span><span>内容来源与版本由使用者自行维护</span></footer>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="confirm-dialog" class="dialog confirm-dialog"><form method="dialog"><div class="dialog-heading"><h2 id="confirm-title">确认操作</h2></div><p id="confirm-message"></p><div id="confirm-extra"></div><div class="dialog-actions"><button value="cancel" class="button secondary">取消</button><button value="confirm" class="button primary" id="confirm-yes">确认</button></div></form></dialog>
{% block dialogs %}{% endblock %}
</body>
</html>
