{% extends 'base.html' %}
{% block title %}阅读剧本 · 喜娃微 PIA{% endblock %}
{% block page %}reader{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="/">← 返回选本</a><span>收录正文 / 选段</span></div>
<section class="reader-heading"><div><span id="reader-category" class="category-label"></span><h1 id="reader-title">正在读取剧本</h1><p id="reader-author"></p></div><div class="button-row"><a id="reader-media" href="/manage" class="button secondary">音视频与暂停点</a><button id="reader-queue" class="button secondary">加入本场</button><a id="reader-control" href="/control" class="button primary">送至播控预览 ↗</a></div></section>
<div class="reader-layout"><aside class="reader-sidebar"><div class="reader-tools"><h2>阅读设置</h2><label>字号 <output id="reader-font-value">20</output><input id="reader-font" type="range" min="16" max="36" value="20"></label><label>行距 <output id="reader-line-value">1.9</output><input id="reader-line" type="range" min="1.3" max="2.8" step="0.1" value="1.9"></label></div><details class="reader-details"><summary>原备注与待核事项</summary><div id="reader-notes"></div></details></aside><article id="reader-body" class="reading-paper"></article></div>
{% endblock %}
